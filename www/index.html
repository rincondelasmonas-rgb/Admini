<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)">
  <title>Archivos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <div id="crumbs" class="crumbs hidden" aria-label="Ruta"></div>
    <div id="banner" class="banner hidden" aria-live="polite"></div>

    <main id="content" class="content">
      <div id="view" class="view"></div>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </main>

    <div id="clipbar" class="clipbar hidden"></div>
    <nav id="selbar" class="selbar hidden" aria-label="Acciones de selección"></nav>
    <button id="fab" type="button" class="fab hidden" aria-label="Crear"><span data-icon="plus"></span><span>Nuevo</span></button>
  </div>

  <section id="viewer" class="preview hidden" aria-label="Vista previa">
    <header class="pv-top">
      <button id="pvBack" type="button" class="icon-btn" aria-label="Cerrar vista previa" data-icon="back"></button>
      <div class="pv-title">
        <div id="pvName" class="pv-name"></div>
        <div id="pvInfo" class="pv-info"></div>
      </div>
    </header>
    <div id="pvBody" class="pv-body"></div>
    <button id="pvPrev" type="button" class="pv-nav prev" aria-label="Anterior" data-icon="left"></button>
    <button id="pvNext" type="button" class="pv-nav next" aria-label="Siguiente" data-icon="right"></button>
    <nav id="pvActions" class="pv-actions" aria-label="Acciones"></nav>
  </section>

  <section id="editor" class="editor hidden" aria-label="Editor de texto">
    <header class="ed-top">
      <button id="edBack" type="button" class="icon-btn" aria-label="Cerrar editor" data-icon="back"></button>
      <div id="edName" class="ed-name"></div>
      <button id="edSave" type="button" class="btn primary ed-save" disabled>Guardar</button>
    </header>
    <textarea id="edText" class="ed-text" spellcheck="false" autocapitalize="none" autocomplete="off" aria-label="Contenido del archivo"></textarea>
  </section>

  <div id="overlay-root"></div>
  <div id="snack" class="snack hidden" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
